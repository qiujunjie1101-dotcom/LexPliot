[project]
name = "lexpilot"
version = "0.1.0"
description = "LexPilot contract review agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0.35,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.0,<7",
  "email-validator>=2.2,<3",
  "pyjwt>=2.9,<3",
  "argon2-cffi>=23.1,<26",
  "typer>=0.12,<1",
  "uuid6>=2024.7.10",
  "alembic>=1.13,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "httpx>=0.27,<1",
  "fakeredis>=2.23,<3",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
