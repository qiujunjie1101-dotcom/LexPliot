name: CI

on:
  pull_request:
  push:
    branches: [main, phase-0-foundation]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lexpilot
          POSTGRES_PASSWORD: lexpilot
          POSTGRES_DB: lexpilot_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U lexpilot -d lexpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://lexpilot:lexpilot@localhost:5432/lexpilot_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-0123456789abcdef0123456789abcdef
      COOKIE_SECURE: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lexpilot
          POSTGRES_PASSWORD: lexpilot
          POSTGRES_DB: lexpilot_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U lexpilot -d lexpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_EXTERNAL_SERVICES: "1"
      DATABASE_URL: postgresql+psycopg://lexpilot:lexpilot@localhost:5432/lexpilot_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-e2e-secret-0123456789abcdef0123456789abcdef
      COOKIE_SECURE: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
